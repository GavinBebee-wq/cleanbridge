name: Refresh opportunity data

on:
  schedule:
    - cron: '0 11 * * *'   # daily, 6am Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - name: Commit the new feed
        run: |
          git config user.name "cleanscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh opportunity data"
          git push
